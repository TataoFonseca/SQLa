<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL por Bloques - App</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <!-- HEADER -->
  <div id="header-container"></div>


  <div class="app-container">

    <!-- CONTROLES SUPERIORES -->
    <div class="controls">
      <button id="showMermaidBtn">Mostrar/Esconder Diagrama ERD</button>
      <button id="showOutputBtn">Mostrar/Esconder SQL Output</button>

      <!-- Combo: Abrir BD -->
      <div class="combobox-container">
        <button id="showOpenBdBtn">Abrir Bases de Datos ▼</button>
        <div class="combobox-menu" id="openBdMenu">
          <ul>
            <li>Importar desde archivo</li>
          </ul>
        </div>
      </div>

      <!-- Combo: Exportar BD -->
      <div class="combobox-container">
        <button id="showExportBdBtn">Exportar Bases de Datos ▼</button>
        <div class="combobox-menu" id="exportBdMenu">
          <ul>
            <li>Exportar como .SQL</li>
            <li>Exportar como .JSON</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- LAYOUT PRINCIPAL -->
    <div class="main-layout">
      <!-- Blockly -->
      <div id="blocklyDiv" class="blockly-container"></div>

      <!-- Mermaid -->
      <div id="mermaidDiv" class="mermaid-container" style="display:none;"></div>
    </div>

    <!-- SQL OUTPUT -->
    <div id="sqlOutput" class="sql-output" style="display:none;"></div>

  </div>

  <!-- TOOLBOX oculto -->
  <xml id="toolbox" style="display:none">
    <category name="Crear tabla en base de datos" colour="260">
      <block type="sql_create_table"></block>
      <block type="sql_column_definition"></block>
       <!-- <category name="Constraints de Columna" colour="160"> -->
        <!-- <block type="sql_column_identity"></block> --> <!-- Deshabilitado porque no es el mismo para todos los motores y puede resultar confuso -->
        <block type="sql_column_not_null"></block>
        <block type="sql_column_unique"></block>
        <block type="sql_column_default"></block>
        <block type="sql_column_check"></block>
        <block type="sql_column_references"></block>
      <!-- </category> -->
    </category>
    <category name="Consultar a Base de datos" colour="160">
      <block type="sql_select"></block>
      <block type="sql_expression"></block>
      <block type="sql_from_simple"></block>
      <block type="sql_join"></block>
      <!-- GROUP BY pre-cargado con un GroupByColumn -->
      <block type="sql_group_by">
        <value name="COLUMNS">
          <block type="sql_groupby_column">
            <field name="COLUMN">column_name</field>
          </block>
        </value>
      </block>

      <!-- GroupByColumn suelto por si el usuario quiere añadir más columnas manualmente -->
      <block type="sql_groupby_column">
        <field name="COLUMN">column_name</field>
      </block>

      <!-- SUBCATEGORÍA PARA FUNCIONES DE AGREGACIÓN -->
      <category name="Funciones de Agregación" colour="120">

        <!-- SUM con Expression que usa extensión de agregación -->
        <block type="sql_sum">
        </block>

        <!-- AVG con Expression que usa extensión de agregación -->
        <block type="sql_avg"></block>

        <!-- COUNT con Expression que usa extensión de agregación -->
        <block type="sql_count"></block>

        <!-- MIN con Expression que usa extensión de agregación -->
        <block type="sql_min">
        </block>

        <!-- MAX con Expression que usa extensión de agregación -->
        <block type="sql_max">
        </block>

      </category>
      <!-- SUBCATEGORÍA: CONDICIONES (WHERE / HAVING) -->

      <!-- HAVING pre-cargado con ExpressionSingle -->
      <block type="sql_having">
        <value name="EXPRESSION">
          <block type="sql_expression_single">
            <field name="COLUMN">columna</field>
          </block>
        </value>
      </block>

      <!-- ExpressionSingle suelto — para conectar manualmente al HAVING -->
      <block type="sql_expression_single">
        <field name="COLUMN">columna</field>
      </block>

      <!-- Nota: Comparison/QuantifiedComparison/Membership se agregan 
          desde click derecho sobre el bloque dentro de HAVING -->


    </category>
    <category name="Logic" colour="%{BKY_LOGIC_HUE}">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
    </category>
    <category name="Loops" colour="%{BKY_LOOPS_HUE}">
      <block type="controls_repeat_ext"></block>
      <block type="controls_whileUntil"></block>
    </category>
    <category name="Math" colour="%{BKY_MATH_HUE}">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
    </category>
  </xml>

  <div id="footer-container"></div>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module">
    import { AppController } from '/src/js/controllers/appController.js';
    import { loadPartials } from '/src/js/utils/loadPartials.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await loadPartials({ header: true, footer: true });
      AppController.init(); // toda la lógica de eventos está dentro
    });
  </script>
</body>

</html>
