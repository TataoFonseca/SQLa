<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL por Bloques - App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <!-- HEADER -->
  <div id="header-container"></div>

  <div class="app-container">
    <!-- ÁREA DE CONTROLES -->
    <div class="controls-area">
      <!-- Botón de menú (siempre visible) -->
      <button class="btn menu-toggle-btn" id="menuToggleBtn">
        <i class="bi bi-list"></i>
      </button>

      <!-- MENÚ HORIZONTAL DESPLEGABLE -->
      <div class="horizontal-menu" id="horizontalMenu">
        <!-- Botón 1: ERD -->
        <button class="menu-item" id="showMermaidBtn">
          <i class="bi bi-diagram-3 me-2"></i>Mostrar/Esconder Diagrama ERD
        </button>

        <!-- Botón 2: SQL Output -->
        <button class="menu-item" id="showOutputBtn">
          <i class="bi bi-code-square me-2"></i>Mostrar/Esconder SQL Output
        </button>

        <!-- Dropdown Exportar -->
        <div class="dropdown d-inline-block">
          <button class="menu-item dropdown-toggle" id="showExportBdBtn" data-bs-toggle="dropdown"
            aria-expanded="false">
            <i class="bi bi-database me-2"></i>Exportar Bases de Datos
          </button>
          <ul class="dropdown-menu" aria-labelledby="showExportBdBtn">
            <li><a class="dropdown-item" href="#" id="exportSqlBtn">Exportar como .SQL</a></li>
            <li><a class="dropdown-item" href="#" id="exportJsonBtn">Exportar como .JSON</a></li>
          </ul>
        </div>

        <!-- Campo de sesión DENTRO del menú -->
        <div class="session-menu-item">
          <div class="session-field">
            <span class="session-label">Sesión:</span>
            <div class="session-password-wrapper">
              <input type="password" id="sessionNumber" class="session-input" value="SES-2025-03-42" readonly>
              <button class="session-toggle-btn" id="toggleSessionVisibility" type="button">
                <i class="bi bi-eye" id="sessionEyeIcon"></i>
              </button>
              <!-- NUEVO: Botón para copiar -->
              <button class="session-copy-btn" id="copySessionBtn" type="button"
                title="Copiar n&#250;mero de sesi&#243;n">
                <i class="bi bi-files"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- LAYOUT PRINCIPAL -->
    <div class="main-layout">
      <!-- Columna Izquierda (Blockly + SQL Output) -->
      <div class="left-column">
        <!-- Blockly -->
        <div id="blocklyDiv" class="blockly-container"></div>
        
        <!-- Barra de herramientas (Ejecutar) -->
        <div class="execute-toolbar" style="display: flex; justify-content: flex-start; padding: 5px 0;">
          <button id="executeBtn" class="btn-glass-play">
            <i class="bi bi-play-fill me-1"></i>Ejecutar
          </button>
        </div>

        <!-- SQL OUTPUT -->
        <div id="sqlOutput" class="sql-output" style="display:none;"></div>
      </div>

      <!-- Mermaid -->
      <div id="mermaidDiv" class="mermaid-container" style="display:none;"></div>
    </div>

  </div>

  <!-- TOOLBOX - AHORA CON CONTENIDO COMPLETO -->
  <xml id="toolbox" style="display:none">
    <category name="Sentencias DDL" colour="260">
      <block type="sql_create_table"></block>
      <block type="sql_column_definition"></block>
    </category>
    <category name="Consultar a Base de datos" colour="160">
      <label text="— SELECT —" web-class="toolbox-label"></label>
      <block type="sql_select"></block>
      <block type="sql_expression"></block>
      <label text="— FROM —" web-class="toolbox-label"></label>
      <block type="sql_from_simple"></block>
      <block type="sql_join"></block>
      <label text="— WHERE —" web-class="toolbox-label"></label>
      <block type="sql_where"></block>
      <label text="— GROUP BY —" web-class="toolbox-label"></label>
      <!-- GROUP BY pre-cargado con un GroupByColumn -->
      <block type="sql_group_by">
        <value name="COLUMNS">
          <block type="sql_groupby_column">
            <field name="COLUMN">column_name</field>
          </block>
        </value>
      </block>

      <!-- GroupByColumn suelto -->
      <block type="sql_groupby_column">
        <field name="COLUMN">column_name</field>
      </block>

      <!-- SUBCATEGORÍA PARA FUNCIONES DE AGREGACIÓN -->
      <category name="Funciones de Agregación" colour="120">
        <!-- SUM -->
        <block type="sql_sum">
          <value name="EXPRESSION">
            <block type="sql_aggregate_expression">
              <field name="COLUMN">columna</field>
            </block>
          </value>
        </block>

        <!-- AVG -->
        <block type="sql_avg">
          <value name="EXPRESSION">
            <block type="sql_aggregate_expression">
              <field name="COLUMN">columna</field>
            </block>
          </value>
        </block>

        <!-- COUNT -->
        <block type="sql_count">
          <value name="EXPRESSION">
            <block type="sql_aggregate_expression">
              <field name="COLUMN">columna</field>
            </block>
          </value>
        </block>

        <!-- MIN -->
        <block type="sql_min">
          <value name="EXPRESSION">
            <block type="sql_aggregate_expression">
              <field name="COLUMN">columna</field>
            </block>
          </value>
        </block>

        <!-- MAX -->
        <block type="sql_max">
          <value name="EXPRESSION">
            <block type="sql_aggregate_expression">
              <field name="COLUMN">columna</field>
            </block>
          </value>
        </block>
      </category>

      <!-- HAVING -->
      <label text="— HAVING —" web-class="toolbox-label"></label>
      <block type="sql_having">
        <value name="EXPRESSION">
          <block type="sql_expression_single">
            <field name="COLUMN">columna</field>
          </block>
        </value>
      </block>

      <!-- ExpressionSingle suelto -->
      <block type="sql_expression_single">
        <field name="COLUMN">columna</field>
      </block>
    </category>

    <category name="Logic" colour="%{BKY_LOGIC_HUE}">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
    </category>

    <category name="Loops" colour="%{BKY_LOOPS_HUE}">
      <block type="controls_repeat_ext"></block>
      <block type="controls_whileUntil"></block>
    </category>

    <category name="Math" colour="%{BKY_MATH_HUE}">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
    </category>
  </xml>

  <div id="footer-container"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script para el menú horizontal -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const menuToggleBtn = document.getElementById('menuToggleBtn');
      const horizontalMenu = document.getElementById('horizontalMenu');

      if (menuToggleBtn && horizontalMenu) {
        menuToggleBtn.addEventListener('click', function () {
          horizontalMenu.classList.toggle('show');
        });

        // Cerrar menú al hacer clic fuera
        document.addEventListener('click', function (event) {
          if (!menuToggleBtn.contains(event.target) && !horizontalMenu.contains(event.target)) {
            horizontalMenu.classList.remove('show');
          }
        });
      }
    });
  </script>

  <!-- Script para el campo de sesión -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const sessionInput = document.getElementById('sessionNumber');
      const toggleBtn = document.getElementById('toggleSessionVisibility');
      const eyeIcon = document.getElementById('sessionEyeIcon');
      const copyBtn = document.getElementById('copySessionBtn');

      // Verificar que TODOS los elementos existen
      if (sessionInput && toggleBtn && eyeIcon && copyBtn) {

        // Función para obtener el número de sesión (simulada)
        async function fetchSessionNumber() {
          try {
            return new Promise(resolve => {
              setTimeout(() => {
                const randomSession = 'SES-' + Math.floor(Math.random() * 10000) + '-' + new Date().getDate();
                resolve(randomSession);
              }, 300);
            });
          } catch (error) {
            console.error('Error obteniendo sesión:', error);
            return 'ERROR';
          }
        }

        // Cargar el número de sesión
        fetchSessionNumber().then(sessionNumber => {
          sessionInput.value = sessionNumber;
        });

        // Toggle mostrar/ocultar
        toggleBtn.addEventListener('click', function () {
          if (sessionInput.type === 'password') {
            sessionInput.type = 'text';
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
          } else {
            sessionInput.type = 'password';
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
          }
        });

        // Funcionalidad de copiar (AHORA DENTRO DEL if)
        copyBtn.addEventListener('click', async function () {
          try {
            // Seleccionar el texto
            sessionInput.select();
            sessionInput.setSelectionRange(0, 99999); // Para móviles

            // Copiar al portapapeles
            await navigator.clipboard.writeText(sessionInput.value);

            // Feedback visual
            const originalIcon = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="bi bi-check-lg"></i>';
            copyBtn.style.color = '#00ff99';

            // Restaurar icono original después de 2 segundos
            setTimeout(() => {
              copyBtn.innerHTML = originalIcon;
              copyBtn.style.color = '';
            }, 2000);

          } catch (err) {
            console.error('Error al copiar:', err);

            // Feedback de error
            const originalIcon = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="bi bi-exclamation-triangle"></i>';
            copyBtn.style.color = '#ff5555';

            setTimeout(() => {
              copyBtn.innerHTML = originalIcon;
              copyBtn.style.color = '';
            }, 2000);
          }
        });
      } else {
        console.warn('No se encontraron todos los elementos del campo de sesión');
      }
    });
  </script>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module">
    import { AppController } from '/src/js/controllers/appController.js';
    import { loadPartials } from '/src/js/utils/loadPartials.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await loadPartials({ header: true, footer: true });
      AppController.init();
    });
  </script>
</body>

</html>
