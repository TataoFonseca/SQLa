version: '3.8'

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqla-db
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PasswordSuperSeguro123!"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql/data
      - ./db-scripts:/scripts
    entrypoint: ["/bin/bash", "-c", "sed -i 's/\\r//' /scripts/entrypoint.sh /scripts/init-db.sh && exec /bin/bash /scripts/entrypoint.sh"]

  backend:
    build:
      context: ..
      dockerfile: Docker/backend.Dockerfile
    container_name: sqla-backend
    ports:
      - "3000:3000"
    volumes:
      - ./db-scripts:/Docker/db-scripts:ro
    environment:
      DB_USER: "sa"
      DB_PASSWORD: "PasswordSuperSeguro123!"
      DB_SERVER: "sql-server"
      DB_DATABASE: "sqla_sandbox"
      DB_PORT: "1433"
    depends_on:
      - sql-server

  frontend:
    build:
      context: ..
      dockerfile: Docker/frontend.Dockerfile
    container_name: sqla-frontend
    ports:
      # - "80:80"
      - "8080:80" # Descomentar si el puerto 80 está en uso por otro servicio
    depends_on:
      - backend

volumes:
  sql-data:
